<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" role="img" aria-label="Auspex — a lightweight, open-source alternative to PL/SQL">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect x="1" y="1" width="858" height="258" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window chrome -->
  <circle cx="30" cy="30" r="6.5" fill="#ff5f57" opacity="0.85"/>
  <circle cx="52" cy="30" r="6.5" fill="#febc2e" opacity="0.85"/>
  <circle cx="74" cy="30" r="6.5" fill="#28c840" opacity="0.85"/>
  <text x="806" y="35" text-anchor="end" class="mono" font-size="13" fill="#484f58">auspex — bash</text>
  <line x1="1" y1="52" x2="859" y2="52" stroke="#21262d" stroke-width="1"/>

  <!-- Wordmark: "Auspex" in white, block cursor in terminal green -->
  <text x="48" y="140" class="mono" font-size="76" font-weight="700" letter-spacing="2">
    <tspan fill="#f0f6fc">Auspex</tspan><tspan fill="#3fb950" opacity="0.9">&#9608;</tspan>
  </text>

  <!-- Tagline -->
  <text x="48" y="178" class="sans" font-size="21" fill="#8b949e">A lightweight, open-source alternative to PL/SQL.</text>

  <!-- Prompt line -->
  <text x="48" y="222" class="mono" font-size="17">
    <tspan fill="#3fb950">$&#160;</tspan><tspan fill="#e6edf3">./bin/auspex examples/todo.apx </tspan><tspan fill="#f0883e">--db :memory:</tspan>
  </text>

  <!-- Output -->
  <text x="48" y="248" class="mono" font-size="17" fill="#8b949e">1: buy milk&#160;&#160;&#160;2: walk dog</text>
</svg>
