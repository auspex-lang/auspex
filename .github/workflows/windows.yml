name: Windows

# Auspex built with MinGW-w64 under MSYS2, running the same test suites and
# examples as Linux and macOS (#90, #96).

# Changes that only touch docs, branding or repo metadata skip this workflow.
# README.md and auspex.1 are deliberately not listed: tests read them.
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  windows-mingw:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up MSYS2 (MINGW64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-libsystre
          mingw-w64-x86_64-sqlite3

    - name: Prepare the test environment
      run: |
        # The tests use /tmp paths. A native Windows program resolves them
        # against the root of the current drive, while MSYS2's bash (which
        # runs the tests' shell commands) maps /tmp to its own directory.
        # A junction from the drive's \tmp to bash's /tmp makes them one.
        drive=$(cygpath -m "$PWD" | cut -c1)
        cmd //c "mklink /J ${drive}:\\tmp $(cygpath -w /tmp)"
        ls -ld "/$(echo "$drive" | tr 'A-Z' 'a-z')/tmp"
        # Some tests build shared libraries with cc.
        command -v cc || cp "$(command -v gcc)" "$(dirname "$(command -v gcc)")/cc.exe"

    - name: Build project
      run: make clean && make all CC=gcc

    - name: Show version
      run: ./bin/auspex.exe --version

    - name: Run tests
      # Every suite, the fuzz corpus replay and the examples, as on Linux.
      run: make test CC=gcc
