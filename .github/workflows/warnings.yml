name: Warnings

# Changes that only touch docs, branding or repo metadata skip this workflow.
# README.md and auspex.1 are deliberately not listed: tests read them.
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  warnings-as-errors:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: Build with -Werror
      run: make clean && make all CFLAGS="-Wall -Wextra -Werror -std=c99 -D_GNU_SOURCE -Iinclude -DUSE_SQLITE"

    - name: Run tests
      run: make test CFLAGS="-Wall -Wextra -Werror -std=c99 -D_GNU_SOURCE -Iinclude -DUSE_SQLITE"
