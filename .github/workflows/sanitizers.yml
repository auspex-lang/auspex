name: Sanitizers

# Changes that only touch docs, branding or repo metadata skip this workflow.
# README.md and auspex.1 are deliberately not listed: tests read them.
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest

    env:
      SANITIZE_FLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: Build with sanitizers
      run: |
        make clean
        make all \
          CFLAGS="-Wall -Wextra -std=c99 -D_GNU_SOURCE -Iinclude -DUSE_SQLITE ${{ env.SANITIZE_FLAGS }}" \
          LDFLAGS="-lsqlite3 -lm ${{ env.SANITIZE_FLAGS }}"

    - name: Run tests with sanitizers
      env:
        ASAN_OPTIONS: detect_leaks=0
      run: |
        make test \
          CFLAGS="-Wall -Wextra -std=c99 -D_GNU_SOURCE -Iinclude -DUSE_SQLITE ${{ env.SANITIZE_FLAGS }}" \
          LDFLAGS="-lsqlite3 -lm ${{ env.SANITIZE_FLAGS }}"
