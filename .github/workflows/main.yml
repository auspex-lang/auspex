name: Tests

# Changes that only touch docs, branding or repo metadata skip this workflow.
# README.md and auspex.1 are deliberately not listed: tests read them.
on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]

    runs-on: ${{ matrix.os }}

    env:
      CC: ${{ matrix.compiler }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        # Ensure the command-line tools are available; sqlite3 ships with macOS.
        xcode-select --install || true

    - name: Build project
      run: make clean && make all

    - name: Run tests
      run: make test
